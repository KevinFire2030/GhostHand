<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Codex Chrome Extension 설치 및 사용법 인포그래픽</title>
  <desc id="desc">Codex Chrome Extension의 용도, 설치 단계, 권한 관리, 보안, 문제 해결, 사용 기준을 요약한 세로형 인포그래픽</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#164e63"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .heroTitle { font: 800 54px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .heroSub { font: 500 24px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #d7f3f0; letter-spacing: 0; }
      .source { font: 500 18px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #bae6fd; letter-spacing: 0; }
      .sectionTitle { font: 800 30px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .cardTitle { font: 800 24px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 500 19px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .bodySmall { font: 500 17px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .label { font: 800 18px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #0f766e; letter-spacing: 0; }
      .number { font: 800 26px Arial, sans-serif; fill: #ffffff; }
      .white { fill: #ffffff; }
      .mutedBox { fill: #eef6f7; }
      .line { stroke: #cbd5e1; stroke-width: 2; }
      .accentStroke { stroke: #0f766e; stroke-width: 4; stroke-linecap: round; }
      .chip { fill: #ecfeff; stroke: #67e8f9; stroke-width: 2; }
      .warn { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
      .danger { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; }
      .ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="1800"/>

  <rect width="1200" height="330" fill="url(#hero)"/>
  <circle cx="1030" cy="105" r="78" fill="#ffffff" opacity="0.10"/>
  <circle cx="1076" cy="160" r="40" fill="#ffffff" opacity="0.14"/>
  <rect x="72" y="68" width="118" height="118" rx="28" fill="#ffffff" opacity="0.14"/>
  <path d="M111 119h38m-19-19v38" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <text x="220" y="105" class="heroTitle">Codex Chrome Extension</text>
  <text x="220" y="158" class="heroTitle">설치 및 사용법</text>
  <text x="220" y="214" class="heroSub">로그인된 Chrome 세션이 필요한 웹 작업을 Codex와 안전하게 연결하기</text>
  <text x="220" y="260" class="source">Source: developers.openai.com/codex/app/chrome-extension</text>

  <g filter="url(#softShadow)">
    <rect x="70" y="375" width="1060" height="180" rx="22" fill="#ffffff"/>
    <rect x="70" y="375" width="12" height="180" rx="6" fill="url(#accent)"/>
    <text x="112" y="430" class="sectionTitle">핵심 판단 기준</text>
    <text x="112" y="475" class="body">Chrome Extension은 로그인된 사용자 상태, 쿠키, 실제 Chrome 프로필이 필요한 작업에 적합하다.</text>
    <text x="112" y="513" class="body">localhost, 파일 미리보기, 공개 페이지 검증은 먼저 Codex 인앱 브라우저를 사용하는 것이 좋다.</text>
  </g>

  <text x="70" y="625" class="sectionTitle">1. 설치 흐름</text>
  <g>
    <line x1="150" y1="716" x2="1050" y2="716" class="line"/>
    <g>
      <circle cx="150" cy="716" r="38" fill="#0f766e"/>
      <text x="142" y="725" class="number">1</text>
      <text x="96" y="790" class="cardTitle">Plugins</text>
      <text x="84" y="822" class="bodySmall">Codex 앱에서</text>
      <text x="95" y="848" class="bodySmall">Plugins 열기</text>
    </g>
    <g>
      <circle cx="330" cy="716" r="38" fill="#0f766e"/>
      <text x="322" y="725" class="number">2</text>
      <text x="270" y="790" class="cardTitle">Chrome</text>
      <text x="252" y="822" class="bodySmall">Chrome 플러그인</text>
      <text x="288" y="848" class="bodySmall">추가</text>
    </g>
    <g>
      <circle cx="510" cy="716" r="38" fill="#0f766e"/>
      <text x="502" y="725" class="number">3</text>
      <text x="452" y="790" class="cardTitle">Connect</text>
      <text x="426" y="822" class="bodySmall">확장 설치 또는</text>
      <text x="452" y="848" class="bodySmall">연결 진행</text>
    </g>
    <g>
      <circle cx="690" cy="716" r="38" fill="#0f766e"/>
      <text x="682" y="725" class="number">4</text>
      <text x="628" y="790" class="cardTitle">Approve</text>
      <text x="610" y="822" class="bodySmall">Chrome 권한</text>
      <text x="640" y="848" class="bodySmall">승인</text>
    </g>
    <g>
      <circle cx="870" cy="716" r="38" fill="#0f766e"/>
      <text x="862" y="725" class="number">5</text>
      <text x="798" y="790" class="cardTitle">Connected</text>
      <text x="790" y="822" class="bodySmall">확장 상태가</text>
      <text x="784" y="848" class="bodySmall">Connected인지 확인</text>
    </g>
    <g>
      <circle cx="1050" cy="716" r="38" fill="#0f766e"/>
      <text x="1042" y="725" class="number">6</text>
      <text x="990" y="790" class="cardTitle">New Thread</text>
      <text x="995" y="822" class="bodySmall">새 Codex 스레드</text>
      <text x="1024" y="848" class="bodySmall">시작</text>
    </g>
  </g>

  <text x="70" y="935" class="sectionTitle">2. 웹사이트 접근 권한</text>
  <g filter="url(#softShadow)">
    <rect x="70" y="965" width="330" height="205" rx="18" class="ok"/>
    <text x="104" y="1018" class="cardTitle">현재 채팅에서 허용</text>
    <text x="104" y="1060" class="bodySmall">이번 스레드의 작업 범위에서만</text>
    <text x="104" y="1088" class="bodySmall">해당 웹사이트를 사용할 수 있다.</text>
    <text x="104" y="1125" class="label">일회성 작업에 적합</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="435" y="965" width="330" height="205" rx="18" class="chip"/>
    <text x="469" y="1018" class="cardTitle">호스트 항상 허용</text>
    <text x="469" y="1060" class="bodySmall">같은 도메인은 다음부터 다시</text>
    <text x="469" y="1088" class="bodySmall">묻지 않고 사용할 수 있다.</text>
    <text x="469" y="1125" class="label">반복 작업에 적합</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="800" y="965" width="330" height="205" rx="18" class="danger"/>
    <text x="834" y="1018" class="cardTitle">웹사이트 거부</text>
    <text x="834" y="1060" class="bodySmall">해당 사이트를 Codex가 사용하지</text>
    <text x="834" y="1088" class="bodySmall">못하도록 차단한다.</text>
    <text x="834" y="1125" class="label">민감한 사이트에 적합</text>
  </g>

  <text x="70" y="1245" class="sectionTitle">3. 보안 체크포인트</text>
  <g filter="url(#softShadow)">
    <rect x="70" y="1275" width="510" height="260" rx="22" fill="#ffffff"/>
    <text x="112" y="1330" class="cardTitle">확장 권한 이해</text>
    <path d="M112 1368h28m-14-14v28" class="accentStroke"/>
    <text x="160" y="1375" class="bodySmall">페이지 디버거 접근</text>
    <path d="M112 1410h28m-14-14v28" class="accentStroke"/>
    <text x="160" y="1417" class="bodySmall">웹사이트 데이터 읽기 및 변경</text>
    <path d="M112 1452h28m-14-14v28" class="accentStroke"/>
    <text x="160" y="1459" class="bodySmall">브라우징 기록, 북마크, 다운로드 관리</text>
    <path d="M112 1494h28m-14-14v28" class="accentStroke"/>
    <text x="160" y="1501" class="bodySmall">네이티브 앱 통신 및 탭 그룹 관리</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="620" y="1275" width="510" height="260" rx="22" fill="#ffffff"/>
    <text x="662" y="1330" class="cardTitle">데이터 사용 원칙</text>
    <text x="662" y="1375" class="bodySmall">OpenAI는 확장 작업 전체를 별도 완전 기록으로</text>
    <text x="662" y="1403" class="bodySmall">저장하지 않는다.</text>
    <text x="662" y="1450" class="bodySmall">다만 페이지 텍스트, 스크린샷, 도구 호출, 요약처럼</text>
    <text x="662" y="1478" class="bodySmall">스레드 컨텍스트에 포함된 내용은 저장될 수 있다.</text>
    <text x="662" y="1520" class="label">민감 정보는 사용자가 직접 확인하며 진행</text>
  </g>

  <text x="70" y="1610" class="sectionTitle">4. 문제 해결 빠른 순서</text>
  <g>
    <rect x="70" y="1640" width="1060" height="88" rx="18" fill="#0f172a"/>
    <text x="110" y="1695" class="body" fill="#ffffff">차단 목록 확인 → Extension Connected 확인 → Chrome 플러그인 ON → 같은 Chrome 프로필 확인 → 새 스레드 → Chrome/Codex 재시작 → 재설치 또는 /feedback</text>
  </g>
  <text x="70" y="1766" class="bodySmall">실무 기준: 로그인 상태가 필요한 작업은 Chrome Extension, 개발 미리보기와 공개 페이지는 인앱 브라우저.</text>
</svg>
